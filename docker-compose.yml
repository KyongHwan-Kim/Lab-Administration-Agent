services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER 를 .env 에 넣어 주세요.}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 .env 에 넣어 주세요.}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB 를 .env 에 넣어 주세요.}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  lab-admin:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATA_DIR: /app/data
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - lab-admin-data:/app/data

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - lab-admin
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-}
    volumes:
      - ./nginx/entrypoint.sh:/entrypoint.sh:ro
      - certbot-www:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    restart: unless-stopped

  certbot:
    image: certbot/certbot:v3.1.0
    depends_on:
      - nginx
    environment:
      DOMAIN: ${DOMAIN:-}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:-}
      CERTBOT_STAGING: ${CERTBOT_STAGING:-0}
    volumes:
      - ./nginx/renew.sh:/renew.sh:ro
      - certbot-www:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    entrypoint: ["/bin/sh", "/renew.sh"]
    restart: unless-stopped

volumes:
  lab-admin-data:
  postgres-data:
  certbot-www:
  certbot-certs:
